<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f2a54">
<title>Палетные линии</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Golos+Text:wght@400;600;800&display=swap">
<style>
/* Раскладка: один экран. Сверху касса и показатели, в середине живая сцена (терминал или трасса), снизу меню или ход рейса. */
:root{
  color-scheme:dark;
  --bg:#20252c;         /* ночной двор терминала */
  --panel:#2b323b;
  --panel-2:#363f4a;
  --line:#f2c230;       /* жёлтая разметка */
  --ink:#f1f3f5;
  --dim:#a2adb9;
  --speed:#58b7ff;
  --qual:#ffb347;
  --bad:#ff5d4d;
  --ok:#6fd08c;
  --display:"Press Start 2P","Courier New",monospace;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:var(--display);font-size:9px;line-height:1.5;color:#1b1f24;background:var(--line);border:0;
  padding:11px 10px;cursor:pointer;box-shadow:0 4px 0 #9a7a12;text-transform:uppercase}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #9a7a12}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.ghost{background:var(--panel-2);color:var(--ink);box-shadow:0 4px 0 #14181d}
button:disabled{opacity:.4;cursor:default;transform:none}
button.small{padding:8px 8px;font-size:8px}
.app{height:100%;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;flex-direction:column;gap:8px}

.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hud div{background:var(--panel);padding:6px 4px;text-align:center;min-width:0}
.hud small{display:block;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.hud b{font-family:var(--display);font-size:9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .neg b{color:var(--bad)}
.stage{position:relative;border:4px solid #14181d;background:#000;flex:0 0 auto}
canvas{display:block;width:100%;height:auto;touch-action:none}

.panel{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.where{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:12px;flex-wrap:wrap}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.menu .big{grid-column:1/-1;font-size:11px;padding:14px}
.log{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
.log p{margin:0;padding-left:8px;border-left:2px solid var(--panel-2)}
.log p:first-child{color:var(--ink);border-color:var(--line)}
.bar{height:16px;background:#14181d;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--line);width:0}
.phase{font-family:var(--display);font-size:11px;color:var(--line)}
.hint{color:var(--dim);font-size:13px}
.hint b{color:var(--bad)}

.modal{position:fixed;inset:0;z-index:70;background:rgba(14,17,21,.9);display:flex;align-items:flex-end;justify-content:center;padding:12px;overflow:hidden}
.sheet{position:relative;width:min(100%,480px);max-height:100%;overflow-y:auto;background:var(--panel);border:4px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.sheet h1{font-family:var(--display);font-size:16px;line-height:1.5;margin:0;color:var(--line);text-wrap:balance}
.sheet h2{font-family:var(--display);font-size:12px;line-height:1.6;margin:0;text-wrap:balance}
.sheet p{margin:0}
.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.eyebrow{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.dim{color:var(--dim)}
.group{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--body);font-size:13px;font-weight:600;text-transform:none;background:var(--panel-2);color:var(--ink);box-shadow:none;padding:8px 10px;border:2px solid transparent;text-align:left}
.chip small{display:block;font-weight:400;color:var(--dim);font-size:11px}
.chip.on{border-color:var(--line);background:#454f2a00;box-shadow:inset 0 0 0 100px rgba(242,194,48,.14)}
.chip:active{transform:none;box-shadow:none}
.rows{display:flex;flex-direction:column;gap:5px}
.rows div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.rows .sum{border-top:2px solid var(--dim);padding-top:6px;font-weight:800}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel-2);padding:8px 10px}
.item div{min-width:0}
.item b{display:block}
.item small{color:var(--dim)}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.sl span{font-weight:600}
.sl output{font-family:var(--display);font-size:9px;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--line);height:28px;margin:0}
.star{color:var(--line);font-weight:800}
.rv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--panel-2);padding:8px 10px;animation:pop .35s both}
.rv b{font-family:var(--display);font-size:13px;color:var(--line);grid-row:1/3;grid-column:2;align-self:center}
.rv small{color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.rv:nth-child(2){animation-delay:.5s}.rv:nth-child(3){animation-delay:1s}.rv:nth-child(4){animation-delay:1.5s}
.after{animation:pop .4s 2.1s both;display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--display);font-size:30px;color:var(--line);text-align:center}
.score small{font-size:10px;color:var(--dim);display:block;margin-top:6px}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-10px;width:6px;height:10px;animation:fall 2.2s linear 2.1s both}
#bBoost{align-self:flex-start}
@keyframes fall{to{transform:translateY(700px) rotate(540deg)}}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#10151a;color:var(--ink);border:2px solid var(--line);
  padding:8px 12px;font-size:13px;z-index:90;max-width:min(90vw,420px);text-align:center}
@media (prefers-reduced-motion:reduce){.rv,.after,.confetti i{animation:none}}
/* Фирменный стиль: сначала синий с жёлтым, после ребрендинга чёрный с золотом */
:root{--bg:#0f2a54;--panel:#1a3f7a;--panel-2:#27539a;--line:#ffd21f;--dim:#b9c8e2}
:root[data-brand="1"]{--bg:#111112;--panel:#1e1e20;--panel-2:#2d2d30;--line:#f5a81c;--dim:#a8a59c}
.app.trip .panel{flex:0 0 auto}
.stage{overflow:hidden}
canvas{max-width:100%}
.stage{overflow:hidden}
canvas{max-width:100%}
.ic{height:20px;width:auto;image-rendering:pixelated;vertical-align:middle;margin-right:6px}
.goals{display:flex;flex-direction:column;gap:3px;font-size:12px}
.goals div{display:flex;justify-content:space-between;gap:8px;background:var(--panel);padding:5px 8px}
.goals b{color:var(--line);white-space:nowrap}
.mg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mg-cell{background:var(--panel-2);color:var(--dim);box-shadow:none;padding:20px 0;font-size:9px}
.mg-cell.on{background:var(--line);color:#14181d}
.mg-cell:disabled{opacity:.25}
.mg-scale{position:relative;height:30px;background:#14181d}
.mg-scale .zone{position:absolute;left:36%;width:28%;top:0;bottom:0;background:var(--ok)}
.mg-scale b{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:#fff;left:0}
.mg-road{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.mg-road div{height:30px;background:#30363d;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:8px}
.mg-road .pit{background:#14181d;color:var(--bad)}
.mg-road .me{background:var(--line);color:#14181d}
.menu .ic{height:14px}
.how{font-size:12px;color:var(--dim)}
.stage{position:relative}
.chipgoal{position:absolute;left:6px;top:6px;max-width:calc(100% - 12px);font-family:var(--body);font-size:12px;line-height:1.3;text-transform:none;text-align:left;
  background:rgba(14,17,21,.75);color:#fff;box-shadow:none;padding:5px 8px;border-left:3px solid var(--line)}
.chipgoal:active{transform:none;box-shadow:none}
.panel{flex:0 0 auto;overflow:visible}
.big{font-size:11px;padding:14px;width:100%}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px 6px;font-size:7px}
.nav .ic{height:18px;margin:0}
.panel h2{font-family:var(--display);font-size:12px;line-height:1.5;margin:0}
.panel p{margin:0}
.panel .eyebrow{display:none}
.triprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.focus{display:block;width:100%;text-align:left;text-transform:none;font-family:var(--body);font-size:15px;line-height:1.35;padding:12px;background:var(--panel-2);color:var(--ink);box-shadow:0 4px 0 #14181d}
.focus small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.tip{background:rgba(242,194,48,.14);border-left:3px solid var(--line);padding:7px 9px;font-size:13px;line-height:1.4}
.tip b{color:var(--line)}
/* окна не длиннее экрана: главная кнопка прилипает к низу, конфетти летит по всему экрану */
.sheet{max-height:calc(100% - 8px)}
.sheet>button:last-child,.sheet>.chips:last-child,.after>button:last-child{position:sticky;bottom:0;margin-bottom:0;z-index:2;box-shadow:0 -10px 14px var(--panel),0 4px 0 #9a7a12}
.sheet>button.ghost:last-child{box-shadow:0 -10px 14px var(--panel),0 4px 0 #14181d}
.confetti{position:fixed;inset:0}
.revline{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--dim)}
.revline b{font-family:var(--display);font-size:11px;color:var(--line)}
details summary{cursor:pointer;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
/* мини-игра под полем: компактная */
.panel .mg-cell{padding:11px 0}
.panel .mg-road div{height:20px}
.panel .mg-scale{height:24px}
.panel .big{padding:11px}
.panel p.dim{font-size:12px;line-height:1.3}
.panel .group{gap:4px}
.panel #mgRows button{padding:7px 8px;font-size:12px!important}
.panel .mg-road{gap:2px}
.panel .mg-road div{height:16px;font-size:7px}
.panel .chips button{padding:9px 14px}
/* обучение: подсвеченная кнопка пульсирует, остальные приглушены и не жмутся */
body.tutor [data-act]:not(.tut){opacity:.3;pointer-events:none}
body.tutor .tut{position:relative;z-index:3;box-shadow:0 0 0 3px #fff,0 0 22px 8px var(--line)!important;animation:tutp .8s infinite alternate}
@keyframes tutp{to{filter:brightness(1.18)}}
#tutHint.flash{animation:tflash .5s 2}
@keyframes tflash{50%{background:var(--line);color:#14181d}}
#tutHint{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:96;width:min(92vw,420px);background:#10151a;color:#fff;border:2px solid var(--line);padding:9px 12px;font-size:13px;line-height:1.35;text-align:center;pointer-events:none}
@media (prefers-reduced-motion:reduce){body.tutor .tut{animation:none}}
/* раскладка по реальному месту */
.chipgoal{max-width:calc(46% - 6px)}   /* справа сверху карточки линий */
.mg-goal{font-size:14px;background:rgba(242,194,48,.14);border-left:3px solid var(--line);padding:6px 9px}
.mg-goal b{color:var(--line)}
.mg-intro,.mg-res{display:flex;flex-direction:column;gap:8px}
.mg-intro p{font-size:13px;line-height:1.35}
.mg-how{color:var(--dim)} .mg-how b{color:var(--line)}
.mg-stars{font-size:30px;line-height:1;text-align:center;letter-spacing:6px;font-family:system-ui,sans-serif}
.mg-stars b{color:var(--line)} .mg-stars i{color:rgba(255,255,255,.2);font-style:normal}
.mg-res h2{text-align:center}
.mg-res .rows{font-size:13px} .mg-res .rows b{font-family:var(--display);font-size:10px;color:var(--line)}
.app{padding-bottom:calc(8px + var(--cut,0px))}
.modal{padding-bottom:calc(12px + var(--cut,0px))}   /* окна тоже поднимаем над спрятанным низом */   /* --cut: сколько снизу не видно на экране, считается в applyCut() */
body.tutor .toast{top:calc(78px + env(safe-area-inset-top,0px));pointer-events:none}   /* в обучении сверху подсказка: итоги мини-игр всплывают под ней */
html,body{margin:0;height:100%}
.app{box-sizing:border-box;height:100%;height:100dvh}
.stage{flex:1 1 0;min-height:110px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.panel,.app.trip .panel{flex:0 1 auto;min-height:0;overflow-y:auto}
</style>
</head><body>

<div class="app">
  <div class="hud">
    <div id="hMoney"><small>Касса</small><b>0 ₽</b></div>
    <div><small id="hSeason">Зима</small><b id="hDay">2001</b></div>
    <div><small>Репутация</small><b id="hRep">0</b></div>
    <div><small>Опыт</small><b id="hXp">0</b></div>
  </div>
  <div class="stage"><canvas id="cv" width="480" height="300"></canvas><button type="button" class="chipgoal" id="chip" data-act="more" hidden></button></div>
  <div class="panel" id="panel"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div id="tutHint" hidden></div>

function checkGoals(){
  const done=[];
  for(let n=0;n<3;n++){
    const i=GOALS.findIndex((g,i)=>!G.goals.includes(i)); if(i<0) break;
    const g=GOALS[i]; if(!g.c(G)) break;
    G.goals.push(i); G.money+=g.money||0; G.xp+=g.xp||0; done.push(`Цель выполнена: ${g.t}. Награда: ${goalPrize(g)}`);
  }
  return done;
}

function tipHTML(k,t){if(G.tips[k])return '';G.tips[k]=1;save();return `<div class="tip"><b>Подсказка.</b> ${t}</div>`}
function findClient(){
  const after=sc=>{const q=clamp(sc+G.hype/100+.06*G.dept.sales,0,1.3);G.hype=Math.round(G.hype*.5);offersUI(makeOffers(q))};

}
function makeOffers(q){
  const capMax=Math.max(...Object.keys(TRUCKS).filter(t=>TRUCKS[t].since<=year()).map(t=>TRUCKS[t].cap));   // на рынке есть машины всех размеров этого года
  const cargos=[...G.cargo].sort((a,b)=>CARGO[a].mult-CARGO[b].mult), dirs=[...G.dirs].sort((a,b)=>DIRS[a].rate-DIRS[b].rate);
  const at=(arr,x)=>arr[clamp(Math.round(x*(arr.length-1)+R(-.8,.8)),0,arr.length-1)];
  const n=q>=.75?3:q>=.4?2:1, out=[];
  for(let i=0;i<n;i++){
    const qi=clamp(q+R(-.25,.15)-i*.08,0,1.2), cargo=i===0&&G.contract?G.contract.cargo:at(cargos,qi), dir=at(dirs,qi);
    out.push({name:pick(CLIENT_NAMES),cargo,dir,pal:clamp(Math.round(demand(cargo)*(.6+qi*.7)),1,capMax),
      opts:G.feats.filter(f=>Math.random()<qi*(FEATS[f].love.includes(cargo)?.9:.45)),qm:+(.9+qi*.25).toFixed(2)});
  }
  return out;
}

function take(d){

// Что удалось найти: размер, год, срок подачи и цена зависят от того, как сыграл
const CARRIERS=[
  {who:'Частник',dRel:-.2,km:.72,late:()=>RI(0,2),old:1},
  {who:'Транспортная компания',dRel:0,km:1,late:()=>RI(0,1),old:0},
  {who:'Проверенный перевозчик',dRel:.06,km:1.4,late:()=>0,old:0}];
function makeTrucks(q,pal){
  const ids=Object.keys(TRUCKS).filter(id=>TRUCKS[id].since<=year()).sort((x,y)=>TRUCKS[x].cap-TRUCKS[y].cap);
  let ideal=ids.findIndex(id=>TRUCKS[id].cap>=pal); if(ideal<0) ideal=ids.length-1;
  // хорошо поискал: больше вариантов, и среди них проверенный перевозчик
  const kinds=q>=.75?[2,1,0]:q>=.4?[1,Math.random()<q?2:0]:[Math.random()<.5?0:1];
  return kinds.map(ki=>{const K=CARRIERS[ki],qi=clamp(q+R(-.2,.15),0,1.2),miss=Math.random()>qi*.9+.1;
    const id=ids[clamp(ideal+(miss?pick([-1,1,1]):0),0,ids.length-1)],top=newestGen(id),gi=K.old?Math.max(0,top-1):top;
    return{id,gi,who:K.who,rel:+clamp(GENS[id][gi].rel+K.dRel+R(-.03,.03),.45,.98).toFixed(2),late:qi>.85?Math.max(0,K.late()-1):K.late(),km:+(K.km*(1.08-Math.min(1,qi)*.16)).toFixed(2)}});
}

// Регулярные линии: выполненный заказ ещё несколько полугодий приносит деньги и занимает машину
// Как продажи в Game Dev Tycoon: линия платит каждую неделю (WEEK секунд реального времени), первые недели растёт, потом затухает.
// Сколько линия принесёт за всю жизнь, осталось как раньше: pay за первое полугодие и минус 15% за каждое следующее.
const WEEK=2.5;
const lineCurve=k=>k<2?(k+1)/3:Math.pow(.88,k-2);
function lineNew(o){
  const total=o.pay*(1-Math.pow(.85,o.n))/.15, W=o.n*8;let s=0;for(let k=0;k<W;k++)s+=lineCurve(k);
  return{client:o.client,cargo:o.cargo,dir:o.dir,truck:o.truck,W,k:0,base:total/s,hist:[],earned:0,t:R(0,WEEK),pop:0};
}
function lineFix(l){if(l.base==null)Object.assign(l,lineNew({client:l.client,truck:l.truck,pay:l.pay||0,n:l.left||2}));return l}   // старые сохранения
function linesRun(dt){
  if(!G.lines.length)return;
  let paid=false;
  for(const l of G.lines){lineFix(l);l.t+=dt;if(l.pop>0)l.pop-=dt;
    if(l.t>=WEEK&&l.k<l.W){l.t-=WEEK;const a=Math.round(l.base*lineCurve(l.k)/10)*10;G.money+=a;l.earned+=a;G.lineCash=(G.lineCash||0)+a;l.hist.push(a);if(l.hist.length>14)l.hist.shift();l.k++;l.pop=.5;paid=true}}
  const left=G.lines.filter(l=>l.k<l.W);if(left.length<G.lines.length)log('Линия закрылась: клиент больше не возит');
  G.lines=left;if(paid)save();
}
function linesTick(){G.rep+=Math.ceil(G.lines.length/2);const sum=G.lineCash||0;G.lineCash=0;return sum}   // довольные клиенты на линиях рассказывают о нас; деньги уже в кассе

    <div class="group">${st.a.map((a,i)=>`<button type="button" class="focus" data-act="focus" data-i="${i}"><b>${a}</b> ${known?mark(w[i]):''}
      <small>Мини-игра «${MINI[ph][i].t}»</small></button>`).join('')}</div>`);

// Игрок выбрал главное дело этапа: играет мини-игру, потом идёт сам этап
function focus(d){

// ================= Мини-игры: правила, игра прямо на картинке, итог =================
// Кнопок под полем нет: все нажатия идут по картинке. Перед игрой карточка с правилами и «Начать», после игры итог и «Дальше».
let MG=null, MGPH=null;   // MG: идущая мини-игра, MGPH: intro (правила), play (игра), res (итог)
const MG_HOW={phones:'Жми прямо на телефон, который звонит.',timing:'Жми в любое место картинки, когда стрелка в зелёной зоне. Три попытки.',order:'Жми по номерам прямо на картинке, по порядку.',mash:'Одно нажатие по картинке, одна штука. Успел раньше времени, больше звёзд.',docs:'Жми на строку, где цифры не сходятся. Три документа.',lanes:'Жми по картинке, и машина перестроится в другую полосу. Ещё раз, и вернётся.'};
const MG_BANNER={phones:'ЖМИ НА ЗВОНОК',timing:'ЖМИ В ЗЕЛЕНОЙ ЗОНЕ',order:'ЖМИ ПО ПОРЯДКУ',mash:'ЖМИ ЧАЩЕ!',docs:'НАЙДИ ОШИБКУ',lanes:'ЖМИ: СМЕНИТЬ ПОЛОСУ'};
const MG_DUR={phones:8,timing:14,order:14,mash:5,docs:18,lanes:10};
const secs=t=>t.toFixed(1).replace('.',',')+' с';
// Палеты с номерами у ворот: жмёшь по ним на поле, палета уезжает
function orderGame(m,g,finish){
  const nums=[1,2,3,4,5,6].sort(()=>Math.random()-.5);
  const o={kind:'order',items:nums.map((n,k)=>({n,x:6+k*16})),expect:m.asc?1:6,errors:0};
  T.mg=o;
  const put=()=>o.items.filter(i=>i.t!=null).length;
  g.tap=(x,y)=>{
    if(y<GY-6||y>GY+22||put()>=6) return;
    const it=o.items.find(i=>i.t==null&&x>=i.x-2&&x<=i.x+15); if(!it) return;
    if(it.n===o.expect){it.t=0;o.expect+=m.asc?1:-1;if(put()>=6){const tt=g.t;setTimeout(()=>finish(1-o.errors*.15-Math.max(0,tt-6)*.05,[['Ошибок',o.errors],['Время',secs(tt)]]),600)}}
    else{o.errors++;it.bad=.4}
  };
  g.step=dt=>{for(const i of o.items){if(i.t!=null)i.t+=dt;if(i.bad>0)i.bad-=dt}};
  g.hud=()=>(put()<6?'Следующая: '+o.expect+' · ':'')+'ошибок '+o.errors;
  g.timeout=()=>finish(put()/6*.5,[['Поставлено',put()+' из 6'],['Ошибок',o.errors]]);
}
// Трасса прямо на поле. Своя полоса ближняя, встречка дальняя: в своей тракторы или ямы, по встречке едут навстречу легковушки.
function roadGame(m,g,finish){
  const r={kind:'road',lane:0,want:null,obs:[],hits:0,passed:0,v:72,nOwn:.6,nOnc:1.4,bump:0,block:0};
  T.mg=r;
  const hit=x=>{r.hits++;floatText(clamp(x-14,2,VW-44),GY-24,'ЗАДЕЛ!','#ff5d4d')};
  g.tap=()=>{r.want=(r.want??r.lane)?0:1};
  g.hud=()=>'Задел: '+r.hits+' · обогнал '+r.passed+(r.block?' · сбоку тихоход, жди':'');
  g.timeout=()=>finish(.4+.6*Math.min(1,r.passed/3)-r.hits*.15,[['Обогнал и объехал',r.passed],['Задел',r.hits]]);
  r.step=dt=>{
    const F=(T.cabX||VW/2)+5, Rr=(T.rearX||0)-1, beside=o=>o.x<F+2&&o.x+o.w>Rr;
    if(r.want!=null){   // в свою полосу не встанешь, пока рядом тихоход
      if(r.want===0&&r.obs.some(o=>o.kind==='slow'&&beside(o))) r.block=1; else{r.lane=r.want;r.want=null;r.block=0}
    }
    r.oncT=r.lane===1?(r.oncT||0)+dt:0;   // сколько уже едем по встречке
    let stuck=null;
    for(const o of r.obs) if(o.kind==='slow'&&r.lane===0&&o.x<=F+3&&o.x+o.w>F)stuck=o;   // тащиться за тихоходом не косяк, просто теряешь время и обгоны
    r.v+=((stuck?stuck.vs:72)-r.v)*Math.min(1,dt*5);   // упёрся в тихохода: тащимся с его скоростью
    for(const o of r.obs){
      if(o.kind==='pit') o.x-=r.v*dt;
      else if(o.kind==='slow'){o.x-=(r.v-o.vs)*dt;if(r.lane===0&&o.x<F+3&&o.x+o.w>F)o.x=F+3}
      else{o.x-=(r.v+58)*dt;if(o.honk>0)o.honk-=dt;if(o.sw>0)o.sw=Math.min(1,o.sw+dt*6);
        if(!o.sw&&r.lane===1&&o.x<F+20&&o.x+o.w>Rr-4){o.sw=.01;o.honk=.8;hit(o.x)}}   // лоб в лоб не бывает: встречный уходит на обочину, а нам косяк
      if(o.kind==='pit'&&!o.hit&&r.lane===0&&o.x+o.w/2<F-4&&o.x+o.w/2>Rr+4){o.hit=1;r.bump=.35;hit(o.x)}
    }
    if(r.bump>0) r.bump-=dt;
    r.obs=r.obs.filter(o=>{if(o.x>-40)return true;if(o.lane===0&&!o.hit)r.passed++;return false});
    // в своей полосе тихоходы с разной скоростью и ямы
    r.nOwn-=dt;
    if(r.nOwn<=0&&g.t<g.dur-1.6){const pit=Math.random()<(m.pit==='ЯМА'?.65:.25),v2=!pit&&Math.random()<.5;
      r.obs.push({kind:pit?'pit':'slow',v2,lane:0,x:VW+45,w:pit?16:v2?32:26,vs:pit?0:R(24,44),c:'#888'});r.nOwn=R(1.5,2.4)}
    // встречка идёт постоянно, поэтому жить на ней нельзя. Но встречная не выедет, если встретит нас, пока мы рядом с тихоходом
    r.nOnc-=dt;
    if(r.nOnc<=0&&g.t<g.dur-1){
      const pass=(VW+75-Rr+10)/(r.v+58)+.4;   // за сколько секунд встречная проедет мимо нашей кормы

      else{errors++;msEv('err',id)}};
    g.hud=()=>(left?'Следующий: '+expect+' · ':'')+'ошибок '+errors;

function recolor(im){   // после ребрендинга синее становится чёрным, жёлтое золотым
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){
    if(!p[i+3]) continue;
    const r=p[i],g=p[i+1],bl=p[i+2],mx=Math.max(r,g,bl),mn=Math.min(r,g,bl);
    if(bl===mx&&mx-mn>40&&bl-r>35){const v=(mx*.17+mn*.25)|0;p[i]=v;p[i+1]=v;p[i+2]=v+4}
    else if(r>170&&g>130&&bl<120&&r-bl>90&&Math.abs(r-g)<75){p[i]=245*mx/255;p[i+1]=168*mx/255;p[i+2]=28*mx/255}
    else if(r>140&&g<90&&bl<90&&r-g>70){const v=(r*.2)|0;p[i]=v+6;p[i+1]=v+6;p[i+2]=v+10}   // красный тягач тоже чёрный
  }
  x.putImageData(d,0,0);return c;
}
function haze(im,winter){   // дальний план бледнее и спокойнее, чтобы не спорил с передним
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data,H=winter?[226,234,243]:[196,222,240],k=winter?.34:.46;
  for(let i=0;i<p.length;i+=4){if(!p[i+3])continue;const g=(p[i]+p[i+1]+p[i+2])/3;for(let j=0;j<3;j++){const v=p[i+j]*.7+g*.3;p[i+j]=v*(1-k)+H[j]*k}}
  x.putImageData(d,0,0);return c;
}
function boxOf(im){   // прямоугольник синего кузова на спрайте машины, в игровых единицах
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
  const w=c.width,h=c.height,p=x.getImageData(0,0,w,h).data,lim=w*.8;let x0=w,x1=0,y0=h,y1=0;
  for(let y=0;y<h*.8;y++)for(let i=0;i<lim;i++){const k=(y*w+i)*4,r=p[k],g=p[k+1],b=p[k+2];
    if(p[k+3]&&b>r+35&&b>g+15&&b>90){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}}
  return x1-x0>20?{x:x0/SPX,y:y0/SPX,w:(x1-x0)/SPX,h:(y1-y0)/SPX}:null;
}
function wheelsOf(im){   // где у машины колёса: тёмные пятна касания у нижнего края спрайта
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
  const w=c.width,h=c.height,p=x.getImageData(0,h-4,w,4).data,col=[];
  for(let i=0;i<w;i++){let d=0;for(let y=0;y<4;y++){const k=(y*w+i)*4;if(p[k+3]&&p[k]+p[k+1]+p[k+2]<200)d++}col.push(d>=2)}
  const out=[];let a=-1,gap=0;
  for(let i=0;i<=w;i++){if(i<w&&col[i]){if(a<0)a=i;gap=0}else if(a>=0){if(++gap>3||i===w){const b=i-gap;if(b-a>=4)out.push({x:(a+b)/2/SPX,r:h*.13/SPX});a=-1;gap=0}}}
  return out;
}
function headX(im){   // где у кадра середина головы, в игровых единицах от левого края
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
  const h=Math.max(1,Math.round(im.height*.18)),p=x.getImageData(0,0,im.width,h).data;let s=0,n=0;
  for(let y=0;y<h;y++)for(let i=0;i<im.width;i++)if(p[(y*im.width+i)*4+3]){s+=i;n++}
  return n?s/n/SPX:im.width/2/SPX;
}
function snowOn(im){    // снежная шапка по верхней кромке спрайта
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
  const p=x.getImageData(0,0,c.width,c.height).data,w=c.width,h=c.height;
  x.clearRect(0,0,w,h);x.fillStyle='#f4f8fb';
  for(let cx=0;cx<w;cx+=2){let y=0;while(y<h&&!p[(y*w+cx)*4+3])y++;if(y<h*.7)x.fillRect(cx,Math.max(0,y-2),2,6+(cx%12<5?2:0))}
  return c;
}
function loadSprites(){

      if(/^(b\d|gazel|bychok|gazon|five|jac|fura|bigmax)$/.test(k))SPR[k].snow=[snowOn(base),snowOn(br)];

function drawTruck(x,id,load,cap,open,spin,bounce,cc,night){

    const cx=x+wl.x,cy=GY-wl.r+.5-(bounce||0);
    for(const a of [spin,spin+Math.PI])px(cx+Math.cos(a)*wl.r*.5-.45,cy+Math.sin(a)*wl.r*.5-.45,.9,.9,'rgba(230,234,238,.95)');
  }

    px(bx,by,bw,bh,'#262b33');px(bx,by,bw,1.5,'rgba(0,0,0,.45)');px(bx,by+bh-1,bw,1,'#3a3f47');
    const pw=Math.min(11,bh*.9),rows=Math.max(1,Math.floor(bh/(pw*.75))),cols=Math.max(1,Math.floor(bw/pw)),n=Math.round(Math.min(1,load/cap)*rows*cols),sc=pw/10;

      ctx.save();ctx.translate(bx+col*pw+.5,by+bh-(row+1)*pw*.75-.5);ctx.scale(sc,sc);drawPalletCode(0,0,cc);ctx.restore()}
  }else if(open&&!iconMode){

    px(bx-.5,by-.5,bw+1,4,'#14181d');px(bx,by,bw,3,'#3a3f47');px(bx,by,bw*Math.min(1,load/cap),3,BR().stripe);

const TINT={};
function tintGuy(k,col){
  const im=spr(k);if(!col||!im)return im;const key=k+col+(G.brand?1:0);if(TINT[key])return TINT[key];
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data,tr=parseInt(col.slice(1,3),16),tg=parseInt(col.slice(3,5),16),tb=parseInt(col.slice(5,7),16);
  for(let i=0;i<p.length;i+=4){if(!p[i+3])continue;const r=p[i],g=p[i+1],b=p[i+2];
    if((b>r+30&&b>g+8)||(G.brand&&Math.max(r,g,b)<70&&Math.abs(r-b)<14)){const l=Math.min(1.25,(r+g+b)/3/(G.brand?45:115));p[i]=Math.min(255,tr*l);p[i+1]=Math.min(255,tg*l);p[i+2]=Math.min(255,tb*l)}}
  x.putImageData(d,0,0);TINT[key]=c;return c;
}

// Дальний план повторяется зеркальными плитками, чтобы не было видно шва
function bgStrip(k,off,base){
  const im=spr(k),sc=Math.max(1,GY*.4/sprH(k)),w=sprW(k)*sc,h=sprH(k)*sc;   // пейзаж растёт вместе с окном, чтобы небо не пустовало
  let x=-(((off%(2*w))+2*w)%(2*w));

      if(Math.sin(clock*14)>-.3){const y=o.lane?GY+LANE1-7:GY+LANE-8;ctx.fillStyle='#ffd21f';ctx.beginPath();ctx.moveTo(VW-2,y);ctx.lineTo(VW-12,y+4);ctx.lineTo(VW-2,y+8);ctx.fill();px(VW-5.5,y+2.5,1,2,'#14181d');px(VW-5.5,y+5.2,1,1,'#14181d')}

      drawTruck(tx,truckId,leaving?T.pallets:loaded,cap,!leaving,leaving?clock*14:0,0,cc,night);
      if(leaving&&Math.random()<.5*FDT*60) smoke.push({x:tx-2,y:GY-9,life:.6});
      if(!trip&&Math.random()<.08*FDT*60) smoke.push({x:90,y:GY-9,life:.7});
    }
    if(trip){
      if(has&&ph!==1){   // погрузчики возят палеты между штабелем и машиной
        for(let i=0;i<G.office;i++){
          const P=2.6, k=((T.t+i*1.3)%P)/P, out=k<.5, ez=q=>(1-Math.cos(Math.PI*q))/2, D=ph===0?58:48, fx=out?28+ez(k/.5)*D:28+D-ez((k-.5)/.5)*D;   // у концов притормаживает
          if(!leaving) drawForklift(fx,out?1:-1,ph===2&&!unload?out:!out,cc,SHIRTS[i]);
        }
      }else if(has) drawForklift(70,1,false,cc,SHIRTS[0]);
      if(ph===1){   // палету взвешивают у ворот
        const sx=gateX()+T.workers.length*8+8,pw=spr('pallet')?sprW('pallet'):9;px(sx-2,GY-1.5,pw+4,2,'#8a94a0');px(sx-2,GY-2,pw+4,.5,'#d5dae0');drawPallet(sx,GY-8.5,cc);
      }
      for(const w of T.workers){
        if(ph===1){drawGuy(w.x,GY,w.color,0,false);
          // до сканеров штрихкодов палеты сверяют по бумажной накладной
          if(G.tech.includes('tsd')){if(Math.sin(w.ph*.7)>.8){px(w.x+6,GY-10,2,2,'#22272e');px(w.x+8,GY-9.5,6,.5,'rgba(255,60,60,.8)')}}
          else{px(w.x+6,GY-11,3,4,'#f4f6f8');px(w.x+6.5,GY-10,2,.5,'#8a94a0');px(w.x+6.5,GY-8.8,2,.5,'#8a94a0')}}
        else drawGuy(w.x,GY,w.color,(w.v||0)>2?w.ph:0,w.carry,cc,w.dir);
      }
      if(T.mg&&T.mg.kind==='order') drawOrderGame(T.mg,cc);
      for(const f of T.flyP||[]){   // по нажатию палета перелетает: от клиента на склад, со склада в кузов, из кузова получателю
        const k=Math.min(1,f.t/.45),src=ph===0?100:unload?92:gateX()+6,dst=ph===0||unload?gateX()+8:92;
        drawPallet(src+(dst-src)*k,GY-9-Math.sin(k*Math.PI)*16,cc);
      }
      for(const r of T.runners||[]){   // каждое нажатие в мини-игре это лишний человек с палетой
        const into=ph===0||unload, k=r.t/1.2, a=into?94:gateX(), b=into?gateX():88;
        drawGuy(a+(b-a)*k,GY,r.c||'#fff',k*24,true,cc,into?-1:1);
      }
    }else{
      if(has) drawForklift(74,-1,false,cc,SHIRTS[0]);
      const tm=team();
      tm.forEach((w,i)=>{   // между рейсами люди прохаживаются от ворот и обратно, всегда лицом по ходу
        const p=(clock/8+i*.37)%1, go=p>.36&&p<.5, back=p>=.86, sm=q=>q*q*(3-2*q), k=go?sm((p-.36)/.14):p>=.5&&p<.86?1:back?1-sm((p-.86)/.14):0;   // постоял, вышел, постоял, вернулся
        drawGuy(gateX()+6+i*9+k*26,GY,w.color,go||back?.01+k*26*.45:0,false,cc,back?-1:1);
      });
    }
  }
  if(ph!==3){signText=unload?'КЛИЕНТ':null;drawDepotFront(unload?1:G.office);signText=null}
  drawLife(ph!==3&&!unload,ph===3,trip);   // птицы, кот, гнездо, редкие гости
  for(const s of smoke){ctx.fillStyle=`rgba(220,225,230,${s.life*.6})`;ctx.fillRect(Math.round(s.x),Math.round(s.y),3,3)}
  for(const b of bubbles){
    const r=b.kind==='B'?b.r+Math.sin(b.age*10)*1.2:b.r;
    disc(b.x,b.y,r+.7,'rgba(20,24,29,.55)');
    disc(b.x,b.y,r,b.kind==='S'?'#58b7ff':b.kind==='Q'?'#ffb347':'#ff5d4d');
    px(b.x-r*.45,b.y-r*.55,1.5,1.5,'rgba(255,255,255,.7)');
    if(b.kind==='B'){px(b.x-1,b.y-5,2,6,'#fff');px(b.x-1,b.y+2.5,2,2,'#fff')}
  }
  for(const p of parts)px(p.x,p.y,2.5,2.5,p.c);
  ctx.font='8px "Press Start 2P",monospace';ctx.textBaseline='top';
  for(const f of floats){ctx.fillStyle=f.c;ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1}
  ctx.restore();
  if(wi) drawSnow(ph===3); else if(rain) drawRain();
  if(t<.5){ctx.fillStyle=`rgba(12,16,44,${(.5-t)*.6})`;ctx.fillRect(-4,-4,VW+8,VH+8)}   // сумерки и ночь
  if(trip){
    drawTripHud(tp);   // как в Game Dev Tycoon: этапы рейса полосками и очки цифрами прямо на поле
    if(T.boost>0&&Math.sin(clock*24)>-.3){ctx.font='8px "Press Start 2P",monospace';ctx.textBaseline='top';ctx.fillStyle='#ffe27a';ctx.textAlign='center';ctx.fillText('АВРАЛ!',VW/2,34);ctx.textAlign='left'}
    // название этапа проезжает по экрану в начале
    if(T.running&&T.t<1.6&&!MGPH){   // пока открыта мини-игра, название этапа не закрывает поле
     const k=T.t/1.6, bx=k<.15?-VW+(k/.15)*VW:k>.85?((k-.85)/.15)*VW:0, name=STAGES[tp].n.toUpperCase().replace(/Ё/g,"Е");
      let lines=[name];
      if(name.length*8>VW-12){const w=name.split(' ');let cut=1,d=1e9;for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' ').length,q=Math.abs(a-name.length/2);if(q<d){d=q;cut=i}}lines=[w.slice(0,cut).join(' '),w.slice(cut).join(' ')]}
      const bh=8+lines.length*11, by=VH*.3;
      px(bx-4,by,VW+8,bh,BR().band);px(bx-4,by,VW+8,1.5,BR().stripe);px(bx-4,by+bh-1.5,VW+8,1.5,BR().stripe);
      ctx.fillStyle=BR().stripe;ctx.textAlign='center';lines.forEach((l,i)=>ctx.fillText(l,bx+VW/2,by+5+i*11));ctx.textAlign='left'}
  }
  if(MGPH!=='play')drawLines(trip?33:4);   // карточки линий с продажами по неделям
  drawMgHud(trip?31:4);   // полоска времени мини-игры поверх сцены этапа
}
// Размер игрового поля: между рейсами широкая полоса, в рейсе высокое окно почти на весь экран телефона
function fit(){
  const app=$('.app'), st=$('.stage'), trip=!!(T&&T.phase>=0);
  if(!app||!st)return;   // страницу закрывают: подгонять нечего
  app.classList.toggle('trip',trip);
  const cssW=st.clientWidth, cssH=Math.max(60,st.clientHeight);
  // всё, что не занято шапкой и кнопками, отдаём игровому полю
  const wide=!trip||SCENE[T.phase]===2;      // когда машина стоит у ворот, она должна влезать в окно целиком
  VW=!trip?152:wide?clamp(92+TRUCKS[T.truck].len+24,152,W):(SCENE[T.phase]===3?clamp(TRUCKS[T.truck].len+84,124,176):168);   // на трассе машина крупнее
  if(MS)VW=Math.max(108,Math.round(172*cssW/cssH));   // сцена мини-игры крупным планом
  VH=cssH*VW/cssW; GY=Math.round(MS?VH*.82:VH-Math.min(VH*.24,44)); lanes();
  // холст в разрешении самого экрана: картинка не растягивается и не превращается в кашу
  // простая графика любит целый масштаб, иначе края плывут
  const dpr=Math.min(3,window.devicePixelRatio||1), pw=G.gfx?Math.round(cssW*dpr):VW*Math.max(2,Math.round(cssW*dpr/VW)), phh=Math.round(pw*cssH/cssW);
  if(cv.width!==pw||cv.height!==phh){cv.width=pw;cv.height=phh;try{draw()}catch(e){}}   // смена размера стирает холст: сразу рисуем, без чёрного кадра
  tutMark();
}
window.addEventListener('resize',()=>fit());
if(window.ResizeObserver) new ResizeObserver(()=>fit()).observe($('.stage'));   // панель выросла или сжалась: поле подстраивается
// Куда летят пузыри: счётчики вверху экрана, с поправкой на камеру
const tgt=k=>[camX+VW*({S:.04,Q:.37,B:.7})[k]+3,22];   // пузырьки летят в цифры на верхней плашке
const VAN_COLORS=['#e8e8e8','#d94f3a','#3f8f5a','#e0a04f','#6f9be8','#8a94a0'];
const bump={S:0,Q:0,B:0};   // счётчик вздрагивает, когда в него влетает пузырь

// Верхняя плашка рейса: четыре этапа полосками (пройденные зелёные, текущий заполняется), под ними скорость, качество и косяки
function drawTripHud(tp){
  px(-4,-4,VW+8,31,'rgba(14,17,21,.84)');
  const names=['ПРИЕМКА','ПОГРУЗКА','ДОРОГА','СДАЧА'], gap=2, sw=(VW-8-gap*3)/4, prog=Math.min(1,T.t/DUR[tp]);
  for(let i=0;i<4;i++){const x=4+i*(sw+gap),k=i<tp?1:i===tp?prog:0;
    px(x,3,sw,8,'#2a3038');if(k>0)px(x,3,sw*k,8,i<tp?'#3fbf6a':'#ffd21f');if(i===tp)px(x,3,sw,1,'rgba(255,255,255,.35)');
    tx(names[i],x+sw/2,5,k>.55?'#14181d':i<=tp?'#e9edf1':'#7d8794',4,'center')}
  [['S','#58b7ff',Math.round(T.S),'скорость'],['Q','#ffb347',Math.round(T.Q),'качество'],['B','#ff5d4d',T.bugs,'косяки']].forEach(([k,c,v,lab])=>{
    const x=VW*({S:.04,Q:.37,B:.7})[k], bm=bump[k];
    disc(x+3,22,3.6+bm*12,c);if(k==='B'){px(x+2.5,19.5,1,3.2,'#fff');px(x+2.5,23.5,1,1,'#fff')}
    const sv=String(v);let fz=7;ctx.font=fz+'px '+SCF;while(ctx.measureText(sv).width>VW*.33-12&&fz>4){fz-=.5;ctx.font=fz+'px '+SCF}const nw=ctx.measureText(sv).width;tx(sv,x+9,21.5-fz/2,bm>0?'#fff':c,fz);
    ctx.font='700 5px '+SCB;if(x+9+nw+2+ctx.measureText(lab).width<x+VW*.33-1)tx(lab,x+9+nw+2,19.5,'#a2adb9',5,'left',1)});   // подпись, только если влезает до следующей цифры
}

// Карточки регулярных линий, как график продаж выпущенной игры в Game Dev Tycoon: клиент, столбики выручки по неделям, сколько всего принесла
const money=v=>v>=1e6?(v/1e6).toFixed(1).replace('.',',')+' млн':v>=1e4?Math.round(v/1000)+' тыс':v>=1000?(v/1000).toFixed(1).replace('.',',')+' тыс':String(Math.round(v));
function drawLines(y0){
  const L=G.lines.slice(-3).reverse(), w=Math.min(78,VW*.52), h=19;
  L.forEach((l,i)=>{if(l.base==null)return;const x=VW-w-3,y=y0+i*(h+2),nm=l.client.length>15?l.client.slice(0,14)+'…':l.client;
    px(x,y,w,h,'rgba(14,17,21,.8)');px(x,y,1.5,h,BR().stripe);
    tx(nm,x+4,y+1.5,'#e9edf1',5,'left',1);
    tx('+'+money(l.earned)+' ₽',x+w-3,y+8,'#6fd08c',5,'right',1);
    tx('ещё '+(l.W-l.k)+' нед.',x+w-3,y+13,'#8a94a0',4,'right',1);
    const mx=Math.max(1,...l.hist),bw=2.2,gp=.8;
    l.hist.forEach((v,j)=>{const bh=Math.max(.8,v/mx*9),last=j===l.hist.length-1;px(x+4+j*(bw+gp),y+h-2-bh,bw,bh,last&&l.pop>0?'#ffe27a':'#58b7ff')});
    if(l.pop>0){ctx.globalAlpha=Math.min(1,l.pop*2);tx('+'+money(l.hist[l.hist.length-1]||0),x+4+l.hist.length*(bw+gp),y+h-14-(.5-l.pop)*10,'#ffe27a',5,'left',1);ctx.globalAlpha=1}
  });
  if(G.lines.length>3)tx('и ещё '+(G.lines.length-3),VW-4,y0+3*(h+2),'#a2adb9',5,'right',1);
}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=camX+(e.clientX-r.left)*VW/r.width,y=(e.clientY-r.top)*VH/r.height;
  if(MG&&MGPH==='play'){if(MG.tap)MG.tap(x,y);return}   // идёт мини-игра: нажатия только в неё
  let best=null,bd=20*20;
  for(const b of bubbles){if(b.kind!=='B')continue;const d=(b.x-x)**2+(b.y-y)**2;if(d<bd){bd=d;best=b}}
  if(best){best.dead=true;if(T)T.popped++;burst(best.x,best.y,'#ff5d4d',10);burst(best.x,best.y,'#ffe27a',5);floatText(clamp(best.x-32,camX+2,camX+VW-66),best.y-8,'РАЗРУЛИЛ','#6fd08c')}
  else if(!MGPH&&!MS)lifeTap(x,y);   // не косяк: может, птица, кот или ёжик
});
let lastT=0;
function frame(ts){
  const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;FDT=dt||1/60;   // всё движение по времени кадра: на 60 и 144 Гц одинаково
  update(dt);draw();renderHud();
  requestAnimationFrame(frame);
}

function intro(){
  show(`<h1>Палетные линии</h1>
    <p>2001 год. У тебя угол на чужом складе.</p>
    <p>Найди клиента, найди под него машину и довези груз. Чем лучше играешь, тем жирнее заказы.</p>
    <button type="button" data-act="close">Начать</button>`);
}
G.gen=G.gen||{gazel:0};
G.lines=G.lines||[];G.hype=G.hype||0;G.dept=G.dept||{sales:0,log:0};for(const k of ["money","xp","rep","best"])if(!isFinite(G[k]))G[k]=0;   // испорченное сохранение не ломает игру
G.tips=G.tips||{};if(G.tut==null)G.tut=G.trips?99:0;   // кто уже играл, обучение не проходит
if(G.gfxV!==2){G.gfx=1;G.gfxV=2;setLens()}   // красивая графика по умолчанию, простая остаётся в «Делах»
renderPanel();
if(G.gfx) loadSprites();
// Окно игры бывает выше видимой части экрана: в приложении Claude на телефоне низ уходит под край, а кнопки вместе с ним.
// Браузер умеет сказать, какая часть страницы реально видна (IntersectionObserver), по нему и поднимаем низ.
// Если замер ничего не нашёл, а это iPhone внутри окна артефакта, берём запас. Ручная поправка лежит в «Делах».
let CUT_AUTO=0, CUT_SEEN=false;
const IOS_FRAMED=/iPhone|iPad|iPod/.test(navigator.userAgent)&&window.self!==window.top;
function applyCut(){
  // запас только когда окно игры почти во весь экран (так в приложении Claude); в Safari окно короче из-за панелей браузера и низ виден
  const tallFrame=IOS_FRAMED&&innerHeight>screen.height*.82;
  const auto=CUT_AUTO>0?CUT_AUTO:(tallFrame?90:0);
  document.documentElement.style.setProperty('--cut',Math.round(auto+(G.cutAdd||0))+'px');
  fit();
}
if(window.IntersectionObserver){
  const probe=document.createElement('div');probe.style.cssText='position:fixed;left:0;top:0;width:2px;height:100%;pointer-events:none;opacity:0';document.body.appendChild(probe);
  new IntersectionObserver(es=>{for(const e of es){const b=e.boundingClientRect,r=e.intersectionRect;if(!e.isIntersecting||r.height<50)continue;
    const cut=clamp(Math.round(b.bottom-r.bottom),0,Math.round(innerHeight*.4));CUT_SEEN=true;if(Math.abs(cut-CUT_AUTO)>2){CUT_AUTO=cut;applyCut()}}},{threshold:Array.from({length:101},(_,i)=>i/100)}).observe(probe);
}
applyCut();
window.addEventListener('resize',applyCut);   // панели Safari прячутся и появляются: пересчитываем
if(G.trips===0) intro();
requestAnimationFrame(frame);
</script>
